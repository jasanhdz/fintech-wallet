openapi: 3.1.0
info:
  title: Fintech Wallet API
  version: 0.3.0
  summary: Contrato de implementación del producto obligatorio de la prueba.
  description: >-
    Contrato aprobado para el alcance de docs/challenge.md y specs/requirements.md.
    Implementación por fases; las respuestas se implementan de forma progresiva.
    No cubre SPEI real, bancos externos, inversiones, biometría ni bonus opcionales.
    0.3.0 (ronda 6, aditivo): Beneficiary.ownAccountId, GET /transfer-policy,
    POST /transfers/{transferId}/cancel, Transfer.expiresAt, estados terminales
    expired/cancelled, Movement.counterparty y formato de fecha fijo
    (YYYY-MM-DDTHH:mm:ss.sssZ, UTC). Ver docs/round6-contract-notes.md.
servers:
  - url: http://localhost:3000/v1
    description: Desarrollo local
tags:
  - name: Auth
    description: Registro, inicio/cierre de sesión y rotación segura de credenciales.
  - name: Accounts
    description: Cuentas MXN propias y saldos disponibles.
  - name: Beneficiaries
    description: Beneficiarios de cuentas internas registradas por el usuario.
  - name: Transfers
    description: Intentos idempotentes entre cuentas internas, confirmación OTP y comprobantes.
  - name: Movements
    description: Historial de la cuenta propia paginado con cursor.
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Obtener token CSRF para sesión web
      security: []
      responses:
        '200':
          description: Token para enviar en X-CSRF-Token; API también coloca cookie no HttpOnly de comprobación.
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken: { type: string }
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Registrar usuario desde web y abrir cuenta MXN
      description: >-
        Crea una cuenta MXN al registrar. En desarrollo local puede crear el fixture
        configurado de dos cuentas propias con contra-asientos de apertura; nunca
        reutiliza esas cantidades como saldo o política de producción.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuario y cuenta MXN creados; refresh web por cookie HttpOnly.
          headers:
            Set-Cookie: { schema: { type: string }, description: Cookie rotativa HttpOnly para cliente web. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión web o móvil
      description: Access JWT de corta vida permanece en memoria web; móvil recibe refresh token para SecureStore. No guardar credenciales/tokens en web localStorage ni mobile AsyncStorage.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada; web usa Set-Cookie, móvil indica client=mobile y guarda refresh en SecureStore.
          headers:
            Set-Cookie: { schema: { type: string }, description: Solo cliente web. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotar refresh y renovar access token
      description: Web envía cookie HttpOnly y CSRF; móvil envía refresh token almacenado en SecureStore. Una rotación invalida el token previo y detecta reutilización.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileRefreshRequest' }
      responses:
        '200':
          description: Refresh rotado y access renovado.
          headers:
            Set-Cookie: { schema: { type: string }, description: Cookie rotativa solo para web. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '204':
          description: Cliente web sin cookie de refresh; no hay sesión que restaurar. Cliente móvil sin token no usa este resultado.
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revocar sesión actual
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileRefreshRequest' }
      responses:
        '204': { description: Sesión revocada y cookie web expirada. }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Obtener identidad de sesión actual
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Listar cuentas propias y saldo disponible
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Solo cuentas del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Consultar una cuenta propia
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cuenta del usuario actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /beneficiaries:
    get:
      tags: [Beneficiaries]
      operationId: listBeneficiaries
      summary: Listar beneficiarios registrados por el usuario
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Solo beneficiarios propios, con CLABE enmascarada.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Beneficiary' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Beneficiaries]
      operationId: createBeneficiary
      summary: Registrar beneficiario interno por CLABE
      description: CLABE de 18 dígitos, checksum válido y destino existente en la misma plataforma. No se conecta a SPEI ni bancos externos.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryInput' }
      responses:
        '201':
          description: Beneficiario interno guardado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /beneficiaries/{beneficiaryId}:
    get:
      tags: [Beneficiaries]
      operationId: getBeneficiary
      summary: Consultar beneficiario propio
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: beneficiaryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Beneficiario propio; CLABE enmascarada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Crear intento de transferencia interna
      description: >-
        Idempotency-Key identifica la operación create-transfer (unique por usuario
        y operación). Si requiere OTP se crea estado awaiting_confirmation sin
        debitar; la confirmación se liga a transferId. Repetir igual key+payload
        devuelve el mismo intento; key con payload distinto produce 409.
        Si el intento original quedó awaiting_confirmation, la repetición informa
        su estado actual: 202 mientras siga pendiente, 200 si ya es completed,
        expired o cancelled (demoOnlyCode solo mientras siga pendiente).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreateRequest' }
      responses:
        '201':
          description: Transferencia inmediata completada en transacción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '200':
          description: Repetición idempotente de un intento OTP que ya alcanzó estado completed, expired o cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '202':
          description: Requiere OTP simulado; no se ha debitado ni acreditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /transfers/{transferId}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Consultar estado/comprobante del intento propio
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado actual del mismo intento; sólo actor/propietario autorizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /transfers/{transferId}/cancel:
    post:
      tags: [Transfers]
      operationId: cancelTransfer
      summary: Cancelar un intento propio pendiente de OTP
      description: >-
        Cierra un intento awaiting_confirmation como cancelled (o expired si su código
        ya venció) sin mover dinero ni borrar filas; queda auditado. Es idempotente por
        estado: repetirlo sobre un intento cancelled/expired devuelve 200 con ese estado
        y no requiere Idempotency-Key. Un intento completed no se puede cancelar (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Intento en estado terminal cancelled o expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /transfer-policy:
    get:
      tags: [Transfers]
      operationId: getTransferPolicy
      summary: Controles de transferencia configurados en el servidor
      description: >-
        Límite diario, consumo del día de negocio del usuario autenticado, umbral y
        vigencia del OTP tal como están configurados en este servidor. Fuera de
        producción son valores de ejemplo demo (demoOnly=true), no política aprobada.
        El cliente no debe fijar estas cifras en código.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Configuración vigente y consumo diario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPolicy' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /transfers/{transferId}/confirm:
    post:
      tags: [Transfers]
      operationId: confirmTransfer
      summary: Confirmar intento con OTP simulado
      description: >-
        El challenge pertenece a un único transferId y expira según configuración;
        no genera SPEI/banco externo. Cada envío de código OTP usa una key de
        confirm-transfer; ante pérdida de respuesta se reintenta misma key+payload,
        y un nuevo código usa una nueva key.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferConfirmRequest' }
      responses:
        '200':
          description: Resultado del intento confirmado; repetición idempotente devuelve el mismo resultado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /accounts/{accountId}/movements:
    get:
      tags: [Movements]
      operationId: listMovements
      summary: Historial propio paginado por cursor
      description: Cursor keyset estable; no usar OFFSET. Los últimos 20 son el tamaño por defecto en móvil.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [debit, credit] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Movimientos de la cuenta propia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPage' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT breve en memoria web y móvil. Refresh no se persiste en web JavaScript.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Obligatorio para web cookie-authenticated; token entregado por GET /auth/csrf.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Aleatoria por operación; se reutiliza en retries exactos del mismo intento.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: RFC 7807 `application/problem+json` con requestId; no filtra detalles internos.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, writeOnly: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, client]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
        client: { type: string, enum: [web, mobile] }
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, writeOnly: true, description: Required for mobile; web sends HttpOnly cookie. }
        client: { type: string, enum: [web, mobile] }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: Short-lived JWT held in memory on web. }
        refreshToken: { type: string, writeOnly: true, description: Returned only for mobile and stored in SecureStore; web uses HttpOnly cookie. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, fullName, email]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
    Account:
      type: object
      required: [id, name, kind, currency, availableBalanceMinor, clabe, clabeMasked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [checking, savings] }
        currency: { type: string, const: MXN }
        availableBalanceMinor: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        clabe: { type: string, pattern: '^[0-9]{18}$', readOnly: true, description: CLABE interna entregada únicamente a su propietario para usarla como beneficiario interno. }
        clabeMasked: { type: string }
        dailyLimitMinor: { type: string, pattern: '^(0|[1-9][0-9]*)$', deprecated: true, description: 'No se devuelve; el límite es por usuario, no por cuenta. Usar GET /transfer-policy.' }
        dailyUsedMinor: { type: string, pattern: '^(0|[1-9][0-9]*)$', deprecated: true, description: No se devuelve; usar GET /transfer-policy. }
    BeneficiaryInput:
      type: object
      additionalProperties: false
      required: [name, alias, clabe]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        alias: { type: string, minLength: 1, maxLength: 80 }
        clabe: { type: string, pattern: '^[0-9]{18}$', writeOnly: true, description: Checksum válido y vinculado a cuenta interna de Billetera MXN. }
    Beneficiary:
      type: object
      required: [id, name, alias, clabeMasked, destinationAccountId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        alias: { type: string }
        clabeMasked: { type: string }
        destinationAccountId: { type: string, format: uuid, readOnly: true, description: 'Cuenta interna a la que resuelve la CLABE (identidad que usa el servidor para validar origen distinto de destino).' }
        ownAccountId:
          type: string
          format: uuid
          readOnly: true
          description: >-
            Presente solo cuando el beneficiario resuelve a una cuenta del mismo usuario
            (igual a destinationAccountId); nunca aparece para cuentas de terceros. El
            cliente lo compara con la cuenta origen para impedir origen = destino antes de
            enviar; el servidor sigue rechazando con 422.
        isFrequent: { type: boolean }
    TransferCreateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [sourceAccountId, destinationType, beneficiaryId, amountMinor, concept, reference]
          properties:
            sourceAccountId: { type: string, format: uuid }
            destinationType: { type: string, const: beneficiary }
            beneficiaryId: { type: string, format: uuid }
            amountMinor: { type: string, pattern: '^[1-9][0-9]*$', description: MXN cents as decimal string. }
            concept: { type: string, minLength: 1, maxLength: 40 }
            reference: { type: string, pattern: '^[0-9]{1,7}$' }
        - type: object
          additionalProperties: false
          required: [sourceAccountId, destinationType, destinationAccountId, amountMinor, concept, reference]
          properties:
            sourceAccountId: { type: string, format: uuid }
            destinationType: { type: string, const: own_account }
            destinationAccountId: { type: string, format: uuid }
            amountMinor: { type: string, pattern: '^[1-9][0-9]*$', description: MXN cents as decimal string. }
            concept: { type: string, minLength: 1, maxLength: 40 }
            reference: { type: string, pattern: '^[0-9]{1,7}$' }
    TransferConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    Transfer:
      type: object
      required: [id, status, sourceAccountId, destination, amountMinor, currency, concept, reference, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [awaiting_confirmation, processing, completed, rejected, expired, cancelled]
          description: >-
            awaiting_confirmation (sin asientos) pasa a completed (OTP correcto), expired
            (venció el código) o cancelled (POST /cancel). completed, expired, cancelled y
            rejected son terminales; expired/cancelled nunca tienen asientos.
        sourceAccountId: { type: string, format: uuid }
        destination:
          oneOf:
            - { $ref: '#/components/schemas/Beneficiary' }
            - { $ref: '#/components/schemas/Account' }
        amountMinor: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, const: MXN }
        concept: { type: string }
        reference: { type: string }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        completedAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        expiresAt:
          description: 'Vencimiento del código OTP de este intento (createdAt + OTP_EXPIRY_SECONDS); null si no requirió OTP. Pasado este instante el intento pasa a expired.'
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
        receiptReference: { type: [string, 'null'] }
        requestId: { type: string }
        demoOnlyCode: { type: string, pattern: '^[0-9]{6}$', readOnly: true, description: Se incluye solo en perfil development cuando OTP está simulado para mostrar el código de prueba al usuario autenticado. Nunca se registra en logs y no existe en producción. }
    Movement:
      type: object
      required: [id, type, amountMinor, currency, concept, reference, status, occurredAt]
      properties:
        id: { type: string, format: uuid }
        transferId: { type: string, format: uuid }
        type: { type: string, enum: [debit, credit] }
        amountMinor: { type: string, pattern: '^[1-9][0-9]*$' }
        currency: { type: string, const: MXN }
        concept: { type: string }
        reference: { type: string }
        status: { type: string, enum: [processing, completed, rejected], description: 'Hoy solo se listan movimientos completed; intentos pendientes, expirados o cancelados no generan movimientos.' }
        occurredAt: { $ref: '#/components/schemas/Timestamp' }
        counterparty: { $ref: '#/components/schemas/MovementCounterparty' }
    MovementCounterparty:
      type: object
      required: [name, clabeMasked]
      description: >-
        La otra parte vista por el dueño de la cuenta. Enviado (debit): el beneficiario tal
        como lo registró el emisor, o la cuenta propia destino. Recibido (credit): la cuenta
        propia origen, o el nombre del usuario emisor con su CLABE enmascarada.
      properties:
        name: { type: string }
        clabeMasked: { type: string, description: 'Primeros 3 y últimos 4 dígitos; nunca la CLABE completa.' }
        ownAccountId: { type: string, format: uuid, description: Solo cuando la otra parte es una cuenta del mismo usuario. }
    TransferPolicy:
      type: object
      required: [currency, businessDate, businessTimeZone, dailyLimitMinor, dailyUsedMinor, dailyRemainingMinor, otpThresholdMinor, otpExpirySeconds, otpMaxAttempts, demoOnly]
      properties:
        currency: { type: string, const: MXN }
        businessDate: { type: string, format: date, description: Día de negocio actual en businessTimeZone. }
        businessTimeZone: { type: string, description: Zona IANA configurada para el día de negocio. }
        dailyLimitMinor: { type: string, pattern: '^[1-9][0-9]*$' }
        dailyUsedMinor: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: 'Salidas completadas del usuario en businessDate. Los intentos pendientes de OTP no reservan límite; se valida al confirmar.' }
        dailyRemainingMinor: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        otpThresholdMinor: { type: string, pattern: '^[1-9][0-9]*$', description: Se exige OTP cuando amountMinor >= otpThresholdMinor. }
        otpExpirySeconds: { type: integer, minimum: 1 }
        otpMaxAttempts: { type: integer, minimum: 1 }
        demoOnly: { type: boolean, description: 'true fuera de producción; las cifras son ejemplos demo, no política aprobada.' }
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z$'
      description: 'Instante UTC en el formato de fecha-hora de ECMAScript (YYYY-MM-DDTHH:mm:ss.sssZ, siempre con milisegundos y Z); parseable con Date.parse en cualquier motor conforme.'
      examples: ['2026-11-16T05:59:00.000Z']
    MovementPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Movement' } }
        nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, instance, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Safe user-facing message only. }
        instance: { type: string, format: uri-reference }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: { type: string }
              detail: { type: string }
