name: product-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Create ephemeral local-only config
        run: npm run env:local
      - name: Create isolated test role and database
        env:
          PGPASSWORD: postgres_ci_only
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_runtime_dev NOLOGIN;"
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_migrator_test LOGIN PASSWORD 'ci_migrator_test';"
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_runtime_test LOGIN PASSWORD 'ci_runtime_test';"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE wallet_test OWNER wallet_migrator_test;"
          psql -h localhost -U postgres -d postgres -c "GRANT CONNECT ON DATABASE wallet_test TO wallet_runtime_test;"
      - name: Apply test-only migrations
        run: npm run db:migrate:test
        env:
          APP_ENV: test
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
          TEST_MIGRATOR_DATABASE_URL: postgres://wallet_migrator_test:ci_migrator_test@localhost:5432/wallet_test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          APP_ENV: test
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
      - name: PostgreSQL integration tests
        run: npm run test:integration
        env:
          APP_ENV: test
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
          TEST_MIGRATOR_DATABASE_URL: postgres://wallet_migrator_test:ci_migrator_test@localhost:5432/wallet_test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser visual check
        run: npm run test:visual
        env:
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
      - name: Integrated web/API end-to-end
        run: npm run test:e2e
        env:
          APP_ENV: development
          OTP_THRESHOLD_MINOR: '1'
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
      - name: Publish masked responsive visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures-${{ github.sha }}
          path: test-results/visual/*.png
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build
      - run: npm run openapi:check
