name: product-ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Create ephemeral local-only config
        run: npm run env:local
      - name: Create isolated test role and database
        env:
          PGPASSWORD: postgres_ci_only
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_runtime_dev NOLOGIN;"
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_migrator_test LOGIN PASSWORD 'ci_migrator_test';"
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE wallet_runtime_test LOGIN PASSWORD 'ci_runtime_test';"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE wallet_test OWNER wallet_migrator_test;"
          psql -h localhost -U postgres -d postgres -c "GRANT CONNECT ON DATABASE wallet_test TO wallet_runtime_test;"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unified sequential QA
        run: npm run qa:report
        env:
          APP_ENV: development
          DATABASE_URL: postgres://wallet_runtime_dev:never-used@localhost:5432/wallet_dev
          TEST_DATABASE_URL: postgres://wallet_runtime_test:ci_runtime_test@localhost:5432/wallet_test
          TEST_MIGRATOR_DATABASE_URL: postgres://wallet_migrator_test:ci_migrator_test@localhost:5432/wallet_test
      - name: Publish QA report and masked responsive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.sha }}
          path: |
            test-results/qa/qa-report.md
            test-results/qa/qa-report.json
            test-results/visual/*.png
          if-no-files-found: warn
          retention-days: 7
